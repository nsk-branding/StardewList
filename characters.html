<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5">
    <title>Stardew Valley - Villagers Guide</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="main-nav">
        <div class="nav-container">
            <div class="nav-logo">
                <span>🌾</span> Stardew Guide
            </div>
            <ul class="nav-links">
                <li><a href="index.html">📦 Items</a></li>
                <li><a href="characters.html" class="active">👥 Villagers</a></li>
                <li><a href="fishing.html">🎣 Fishing</a></li>
            </ul>
        </div>
    </nav>

    <div class="container" role="main">
        <header>
            <h1>
                <span>🌾 Stardew Valley</span>
                <span style="font-weight:300; color:#4d6b4c;">Villagers Guide</span>
            </h1>
            <p class="subtitle">
                Search by <strong>villager name</strong> or by <strong>item</strong> to find out who loves, likes, or hates it.
            </p>
        </header>

        <section class="search-section" role="search" aria-label="Filter villagers and gifts">
            <div class="search-wrapper">
                <label for="filter-input">
                    <span aria-hidden="true">🔍</span> Search
                </label>
                <input type="text" id="filter-input" placeholder="e.g.: 'abigail', 'pizza', 'diamond'..." aria-describedby="result-counter">
                <button class="search-button" type="button">Search</button>
                <span class="result-counter" id="result-counter" aria-live="polite">0 villagers</span>
            </div>
        </section>

        <!-- Glassmorphism Cards Grid -->
        <div id="cards-container" class="cards-grid">
            <!-- Cards injected by JavaScript -->
        </div>

        <div id="empty-message" class="no-results" style="display: none;" role="status">
            <span aria-hidden="true">🧺</span> No villagers or items match your search.
        </div>

        <footer>
            <span>✨ Data based on <a href="https://stardewvalleywiki.com/" target="_blank" rel="noopener noreferrer">Stardew Valley Wiki</a></span>
            <span>NSK</span>
        </footer>
    </div>

    <script src="js/data-characters.js"></script>
    <script src="js/app-characters.js"></script>
</body>
</html>
